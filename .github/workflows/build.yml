name: Build EXE / APP

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch: {}   # кнопка "Run workflow" вручную

# Чтобы не гонять несколько сборок одного и того же коммита параллельно
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Sanity check (компиляция)
        run: python -m py_compile main.py bot_engine.py config.py calibrate.py storage.py hotkey.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name clicker_bot main.py

      - name: Upload artifact (windows)
        uses: actions/upload-artifact@v4
        with:
          name: clicker_bot-windows
          path: dist/clicker_bot.exe
          if-no-files-found: error

  build-macos:
    # macos-14 = Apple Silicon (arm64). Для Intel используй macos-13.
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Sanity check (компиляция)
        run: python -m py_compile main.py bot_engine.py config.py calibrate.py storage.py hotkey.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # БЕЗ --onefile: на macOS --onefile даёт голый бинарь, а не .app-бандл.
      # --windowed создаёт dist/clicker_bot.app
      - name: Build .app
        run: |
          pyinstaller --windowed --name clicker_bot \
            --osx-bundle-identifier com.clicker.bot \
            main.py

      # .app — это папка; артефакты удобнее отдавать zip'ом
      - name: Zip .app
        run: |
          cd dist && zip -r -y clicker_bot-macos.zip clicker_bot.app

      - name: Upload artifact (macos)
        uses: actions/upload-artifact@v4
        with:
          name: clicker_bot-macos
          path: dist/clicker_bot-macos.zip
          if-no-files-found: error

  # Создаёт GitHub Release с .exe и .app.zip, только когда пушим тег v*
  release:
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # встроенного GITHUB_TOKEN достаточно, PAT не нужен

    steps:
      - name: Download windows artifact
        uses: actions/download-artifact@v4
        with:
          name: clicker_bot-windows
          path: release/windows

      - name: Download macos artifact
        uses: actions/download-artifact@v4
        with:
          name: clicker_bot-macos
          path: release/macos

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/windows/clicker_bot.exe
            release/macos/clicker_bot-macos.zip
          generate_release_notes: true
          # встроенный GITHUB_TOKEN подставляется автоматически
