name: Build EXE / APP

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch: {}   # кнопка "Run workflow" вручную

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name clicker_bot main.py

      - name: Upload artifact (windows)
        uses: actions/upload-artifact@v4
        with:
          name: clicker_bot-windows
          path: dist/clicker_bot.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build .app
        run: |
          pyinstaller --onefile --windowed --name clicker_bot main.py

      - name: Upload artifact (macos)
        uses: actions/upload-artifact@v4
        with:
          name: clicker_bot-macos
          path: dist/clicker_bot
          if-no-files-found: error

  # Создаёт GitHub Release с .exe и .app, только когда пушим тег v*
  release:
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download windows artifact
        uses: actions/download-artifact@v4
        with:
          name: clicker_bot-windows
          path: release/windows

      - name: Download macos artifact
        uses: actions/download-artifact@v4
        with:
          name: clicker_bot-macos
          path: release/macos

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/windows/clicker_bot.exe
            release/macos/clicker_bot
          generate_release_notes: true